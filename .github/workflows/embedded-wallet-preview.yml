name: Embedded wallet preview verification
on:
  push:
    branches:
      - prototype/embedded-wallet-amoy
    paths:
      - package.json
      - src/components/wallet/EmbeddedWalletEntry.tsx
      - .github/workflows/embedded-wallet-preview.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile dependency lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile to prototype branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock thirdweb prototype dependency"
            git push
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
